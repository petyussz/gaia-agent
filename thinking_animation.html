<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Processing Loader - Sci-Fi Crystal Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background-color: #E8E3D9; /* Light tan backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- p5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
    let nodes = [];
    const numNodes = 40;            // Lean node count for clean geometry
    const maxConnectDistance = 120; // Facet connection threshold
    const grayscale = 20;           // Single grayscale tone

    let globalTime = 0;
    let baseScale = 150;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        resetNetwork();
    }

    function resetNetwork() {
        nodes = [];
        for (let i = 0; i < numNodes; i++) {
            nodes.push(new LoaderNode(i, numNodes));
        }
    }

    function draw() {
        background(232, 227, 217); // Light tan canvas (#E8E3D9)

        // Drive time evolution for continuous autonomous thinking/morphing animation
        globalTime += 0.015;

        // Gentle floating drift for the center of mass
        let cx = width / 2 + sin(globalTime * 0.4) * 20;
        let cy = height / 2 + cos(globalTime * 0.3) * 15;

        // Dynamic pulsing scale simulating AI load breathing
        let breathingScale = baseScale + sin(globalTime * 1.2) * 18;

        // Update all crystal nodes
        for (let node of nodes) {
            node.update(cx, cy, breathingScale, globalTime);
        }

        // --- STEP 1: Build Adjacency Map ---
        let adj = Array.from({ length: nodes.length }, () => []);
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                if (d < maxConnectDistance) {
                    adj[i].push(j);
                    adj[j].push(i);
                }
            }
        }

        // --- STEP 2: Core Reachability Check (BFS keeps structure fully connected) ---
        let connectedToCore = new Array(nodes.length).fill(false);
        let queue = [0]; // Anchor search from the inner central node
        connectedToCore[0] = true;

        while (queue.length > 0) {
            let curr = queue.shift();
            for (let neighbor of adj[curr]) {
                if (!connectedToCore[neighbor]) {
                    connectedToCore[neighbor] = true;
                    queue.push(neighbor);
                }
            }
        }

        // --- STEP 3: Render Faceted Network Lines ---
        for (let i = 0; i < nodes.length; i++) {
            if (!connectedToCore[i]) continue;

            for (let j of adj[i]) {
                if (j > i && connectedToCore[j]) {
                    let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                    let alpha = map(d, 0, maxConnectDistance, 140, 0);

                    stroke(grayscale, alpha);
                    strokeWeight(map(d, 0, maxConnectDistance, 1.5, 0.25));
                    line(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                }
            }
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        resetNetwork();
    }

    // --- Autonomous Thinking / Loading Crystal Node ---
    class LoaderNode {
        constructor(index, total) {
            this.index = index;
            this.pos = createVector(0, 0);
            
            // Base geometry angles with subtle uneven offsets
            this.baseAngle = (TWO_PI / total) * index + random(-0.15, 0.15);
            this.depth = index === 0 ? 0 : random(0.25, 1.15);

            // Perlin noise seeds for autonomous motion
            this.noiseSeedX = random(1000);
            this.noiseSeedY = random(2000);
            
            // Speed factor for localized node jitter
            this.morphSpeed = random(0.8, 1.4);
        }

        update(cx, cy, currentScale, t) {
            // Anchor node (Index 0) stays near central hub with slight local sway
            if (this.index === 0) {
                let hubOffset = createVector(
                    (noise(t * 0.8) - 0.5) * 30,
                    (noise(t * 0.8 + 500) - 0.5) * 30
                );
                this.pos.set(cx + hubOffset.x, cy + hubOffset.y);
                return;
            }

            // 1. Slow, continuous rotational drift
            let dynamicAngle = this.baseAngle + sin(t * 0.2 + this.index) * 0.15;

            // 2. Multidirectional organic Perlin distortion
            let noiseFactor = noise(this.noiseSeedX + t * this.morphSpeed, this.noiseSeedY + t * this.morphSpeed);
            let radialMorph = map(noiseFactor, 0, 1, 0.5, 1.3);

            // 3. Sequential pulse ripple traveling through nodes to mimic token generation
            let thoughtPulse = sin(t * 2.5 - this.index * 0.3) * 12;

            // Compute raw polar position
            let rawRadius = (this.depth * currentScale + thoughtPulse) * radialMorph;
            let rawX = cos(dynamicAngle) * rawRadius;
            let rawY = sin(dynamicAngle) * rawRadius;

            // 4. Asymmetrical shear transform to maintain the crystalline silhouette
            let skewedX = rawX * 1.1 + rawY * 0.2;
            let skewedY = rawY * 0.85 - rawX * 0.15;

            this.pos.set(cx + skewedX, cy + skewedY);
        }
    }
</script>

</body>
</html>
