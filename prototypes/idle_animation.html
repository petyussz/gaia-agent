<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent State - Sci-Fi Crystal Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }
        body {
            background-color: #E8E3D9; /* Light tan backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
        }
        /* Minimalist UI HUD Display */
        #hud {
            position: absolute;
            bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(232, 227, 217, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(20, 20, 20, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.2s ease;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #141414;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .status-dot.pulse {
            animation: softPulse 1.8s infinite ease-in-out;
        }
        .status-text {
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #141414;
            font-weight: 600;
        }
        @keyframes softPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.5); opacity: 1; }
        }
    </style>
    <!-- p5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<div id="hud">
    <div id="dot" class="status-dot pulse"></div>
    <span id="label" class="status-text">State: Idle</span>
</div>

<script>
    let nodes = [];
    const numNodes = 40;
    const maxConnectDistance = 120;
    const grayscale = 20;

    let globalTime = 0;
    let baseScale = 150;

    // Agent State Manager (Permanently set to active animation parameters)
    let isThinking = true;
    
    // Lerp Vectors set to original thinking dynamic parameters
    let currentSpeed = 0.016;    
    let targetSpeed = 0.016;
    
    let currentPulse = 12.0;      
    let targetPulse = 12.0;
    
    let currentDrift = 22.0;      
    let targetDrift = 22.0;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        resetNetwork();
    }

    function resetNetwork() {
        nodes = [];
        for (let i = 0; i < numNodes; i++) {
            nodes.push(new AgentNode(i, numNodes));
        }
    }

    function draw() {
        background(232, 227, 217); // Light tan canvas (#E8E3D9)

        // Interpolate dynamic parameters
        currentSpeed = lerp(currentSpeed, targetSpeed, 0.04);
        currentPulse = lerp(currentPulse, targetPulse, 0.04);
        currentDrift = lerp(currentDrift, targetDrift, 0.04);

        globalTime += currentSpeed;

        // Center of mass movement
        let cx = width / 2 + sin(globalTime * 0.3) * currentDrift;
        let cy = height / 2 + cos(globalTime * 0.25) * (currentDrift * 0.75);

        // Breathing scale
        let breathAmp = isThinking ? 18 : 6;
        let breathFreq = isThinking ? 1.2 : 0.4;
        let breathingScale = baseScale + sin(globalTime * breathFreq) * breathAmp;

        // Update nodes
        for (let node of nodes) {
            node.update(cx, cy, breathingScale, globalTime, currentPulse);
        }

        // --- STEP 1: Build Adjacency Graph ---
        let adj = Array.from({ length: nodes.length }, () => []);
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                if (d < maxConnectDistance) {
                    adj[i].push(j);
                    adj[j].push(i);
                }
            }
        }

        // --- STEP 2: Core Reachability (BFS) ---
        let connectedToCore = new Array(nodes.length).fill(false);
        let queue = [0];
        connectedToCore[0] = true;

        while (queue.length > 0) {
            let curr = queue.shift();
            for (let neighbor of adj[curr]) {
                if (!connectedToCore[neighbor]) {
                    connectedToCore[neighbor] = true;
                    queue.push(neighbor);
                }
            }
        }

        // --- STEP 3: Render Faceted Network Lines ---
        for (let i = 0; i < nodes.length; i++) {
            if (!connectedToCore[i]) continue;

            for (let j of adj[i]) {
                if (j > i && connectedToCore[j]) {
                    let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                    let alpha = map(d, 0, maxConnectDistance, 140, 0);

                    stroke(grayscale, alpha);
                    strokeWeight(map(d, 0, maxConnectDistance, 1.4, 0.25));
                    line(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                }
            }
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        resetNetwork();
    }

    // --- Dynamic Agent Node Class ---
    class AgentNode {
        constructor(index, total) {
            this.index = index;
            this.pos = createVector(0, 0);
            
            this.baseAngle = (TWO_PI / total) * index + random(-0.1, 0.1);
            this.depth = index === 0 ? 0 : random(0.3, 1.15);

            this.noiseSeedX = random(1000);
            this.noiseSeedY = random(2000);
        }

        update(cx, cy, currentScale, t, pulseAmount) {
            // Center Anchor Point
            if (this.index === 0) {
                let hubOffset = createVector(
                    (noise(t * 0.4) - 0.5) * (currentDrift * 0.8),
                    (noise(t * 0.4 + 500) - 0.5) * (currentDrift * 0.8)
                );
                this.pos.set(cx + hubOffset.x, cy + hubOffset.y);
                return;
            }

            // 1. Angular Drift (Smooth sinusoidal swaying)
            let dynamicAngle = this.baseAngle + sin(t * 0.15 + this.index * 0.2) * 0.08;

            // 2. Smooth Low-Frequency Organic Noise
            let noiseFactor = noise(this.noiseSeedX + t * 0.3, this.noiseSeedY + t * 0.3);
            let radialMorph = map(noiseFactor, 0, 1, 0.7, 1.2);

            // 3. Token Thought Ripples
            let thoughtPulse = sin(t * 3.0 - this.index * 0.35) * pulseAmount;

            // Compute raw polar position
            let rawRadius = (this.depth * currentScale + thoughtPulse) * radialMorph;
            let rawX = cos(dynamicAngle) * rawRadius;
            let rawY = sin(dynamicAngle) * rawRadius;

            // 4. Asymmetrical Crystalline Shear
            let skewedX = rawX * 1.1 + rawY * 0.2;
            let skewedY = rawY * 0.85 - rawX * 0.15;

            this.pos.set(cx + skewedX, cy + skewedY);
        }
    }
</script>

</body>
</html>
